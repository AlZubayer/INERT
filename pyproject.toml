[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inert-pilot"
version = "0.1.0"
description = "Local, reproducible INERT pilot"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2,<3", "pyyaml>=6", "numpy>=1.26", "httpx>=0.27",
  "datasets>=3", "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
inert = "inert.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=data/pytest-tmp"
markers = ["docker: executes hand-written fixtures inside Docker with networking disabled"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
